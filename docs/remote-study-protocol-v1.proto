syntax = "proto3";

package remote.study.protocol.v1;

option java_multiple_files = true;
option java_package = "io.remotestudy.protocol.v1";

// Transport-neutral wire contract. Nearby Connections is the first adapter;
// a future relay adapter must carry the same envelopes and media metadata.

message Envelope {
  uint32 protocol_version = 1;
  string message_id = 2;
  string session_id = 3;
  string sender_device_id = 4;
  Role sender_role = 5;
  uint64 sequence = 6;
  int64 sent_at_epoch_ms = 7;
  string correlation_id = 8;

  oneof body {
    Ack ack = 20;
    Heartbeat heartbeat = 21;
    SessionCommand session_command = 22;
    SessionState session_state = 23;
    PhaseChanged phase_changed = 24;
    ProblemCompleted problem_completed = 25;
    ActivityEvidence activity_evidence = 26;
    AlertState alert_state = 27;
    SnapshotAvailable snapshot_available = 28;
    MediaRequest media_request = 29;
    MediaOffer media_offer = 30;
    UserMessage user_message = 31;
    MessageState message_state = 32;
    DeviceHealth device_health = 33;
    CalibrationState calibration_state = 34;
  }
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  STUDENT = 1;
  TEACHER = 2;
}

message Ack {
  string acked_message_id = 1;
  AckStatus status = 2;
  string reason_code = 3;
  uint64 highest_contiguous_sequence = 4;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  APPLIED = 1;
  ALREADY_APPLIED = 2;
  REJECTED = 3;
  RETRYABLE = 4;
}

message Heartbeat {
  int64 observed_at_epoch_ms = 1;
  uint64 last_received_sequence = 2;
}

message StudyPlan {
  string plan_id = 1;
  repeated PhaseSpec phases = 2;
  RepeatPolicy repeat_policy = 3;
}

message PhaseSpec {
  PhaseKind kind = 1;
  int64 duration_ms = 2;
}

enum PhaseKind {
  PHASE_KIND_UNSPECIFIED = 0;
  MEDITATION = 1;
  STUDY = 2;
  BREAK = 3;
}

enum RepeatPolicy {
  REPEAT_POLICY_UNSPECIFIED = 0;
  ONCE = 1;
  REPEAT_STUDY_BREAK = 2;
}

message SessionCommand {
  string command_id = 1;
  SessionCommandKind kind = 2;
  CommandOrigin origin = 3;
  StudyPlan requested_plan = 4;
  int64 countdown_ms = 5;
}

enum SessionCommandKind {
  SESSION_COMMAND_KIND_UNSPECIFIED = 0;
  REQUEST_START = 1;
  ACCEPT_START = 2;
  CANCEL_START = 3;
  PAUSE = 4;
  RESUME = 5;
  STOP = 6;
}

enum CommandOrigin {
  COMMAND_ORIGIN_UNSPECIFIED = 0;
  STUDENT_VOICE = 1;
  STUDENT_TOUCH = 2;
  TEACHER_REQUEST = 3;
}

message SessionState {
  SessionStatus status = 1;
  string plan_id = 2;
  PhaseKind phase = 3;
  uint32 phase_index = 4;
  int64 phase_started_at_epoch_ms = 5;
  int64 phase_duration_ms = 6;
  int64 remaining_ms = 7;
  uint32 completed_problem_count = 8;
  string active_command_id = 9;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  READY = 1;
  START_COUNTDOWN = 2;
  RUNNING = 3;
  PAUSED = 4;
  COMPLETED = 5;
  STOPPED = 6;
}

message PhaseChanged {
  PhaseKind previous = 1;
  PhaseKind current = 2;
  uint32 phase_index = 3;
  int64 started_at_epoch_ms = 4;
  int64 duration_ms = 5;
}

message ProblemCompleted {
  string event_id = 1;
  CommandOrigin origin = 2;
  uint32 session_total = 3;
  int64 observed_at_epoch_ms = 4;
  bool cancelled = 5;
}

message ActivityEvidence {
  PresenceState presence = 1;
  float presence_confidence = 2;
  WritingState writing = 3;
  float writing_confidence = 4;
  int64 observed_at_epoch_ms = 5;
  int64 presence_unchanged_ms = 6;
  int64 writing_unchanged_ms = 7;
  repeated string reason_codes = 8;
  uint32 calibration_version = 9;
}

enum PresenceState {
  PRESENCE_STATE_UNSPECIFIED = 0;
  PRESENT = 1;
  ABSENT = 2;
  PRESENCE_UNKNOWN = 3;
}

enum WritingState {
  WRITING_STATE_UNSPECIFIED = 0;
  ACTIVE = 1;
  INACTIVE = 2;
  WRITING_UNKNOWN = 3;
}

message AlertState {
  string alert_id = 1;
  AlertKind kind = 2;
  AlertLifecycle lifecycle = 3;
  int64 started_at_epoch_ms = 4;
  int64 updated_at_epoch_ms = 5;
  int64 duration_ms = 6;
  string related_snapshot_id = 7;
}

enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  PRESENCE_ABSENT_10S = 1;
  BOOK_MOTION_INACTIVE_30S = 2;
  CONNECTION_STALE = 3;
  CAMERA_UNAVAILABLE = 4;
  PLACEMENT_INVALID = 5;
  STORAGE_LOW = 6;
  THERMAL_DEGRADED = 7;
}

enum AlertLifecycle {
  ALERT_LIFECYCLE_UNSPECIFIED = 0;
  OPENED = 1;
  UPDATED = 2;
  RESOLVED = 3;
}

message SnapshotAvailable {
  string snapshot_id = 1;
  int64 captured_at_epoch_ms = 2;
  uint32 calibration_version = 3;
  MediaDescriptor context_thumbnail = 4;
  MediaDescriptor book_roi = 5;
}

message MediaDescriptor {
  string media_id = 1;
  MediaVariant variant = 2;
  string mime_type = 3;
  uint64 byte_size = 4;
  uint32 width = 5;
  uint32 height = 6;
  bytes sha256 = 7;
  int64 expires_at_epoch_ms = 8;
}

enum MediaVariant {
  MEDIA_VARIANT_UNSPECIFIED = 0;
  CONTEXT_THUMBNAIL = 1;
  BOOK_ROI_HIGH = 2;
  VOICE_MESSAGE = 3;
}

message MediaRequest {
  string request_id = 1;
  string media_id = 2;
  MediaVariant variant = 3;
}

message MediaOffer {
  string request_id = 1;
  MediaDescriptor media = 2;
  int64 transport_payload_id = 3;
}

message UserMessage {
  string user_message_id = 1;
  MessageKind kind = 2;
  string text = 3;
  MediaDescriptor voice = 4;
  int64 created_at_epoch_ms = 5;
  string reply_to_message_id = 6;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  TEXT = 1;
  VOICE = 2;
}

message MessageState {
  string user_message_id = 1;
  DeliveryState delivery = 2;
  int64 changed_at_epoch_ms = 3;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  SENT = 2;
  DELIVERED = 3;
  PLAYED = 4;
  DELETED = 5;
  FAILED = 6;
}

message DeviceHealth {
  int64 observed_at_epoch_ms = 1;
  uint32 battery_percent = 2;
  ThermalState thermal = 3;
  uint64 free_storage_bytes = 4;
  bool camera_active = 5;
  bool voice_engine_active = 6;
  bool placement_valid = 7;
  int64 last_snapshot_at_epoch_ms = 8;
}

enum ThermalState {
  THERMAL_STATE_UNSPECIFIED = 0;
  NOMINAL = 1;
  LIGHT = 2;
  MODERATE = 3;
  SEVERE = 4;
  CRITICAL = 5;
}

message CalibrationState {
  uint32 calibration_version = 1;
  bool book_region_valid = 2;
  bool presence_zone_valid = 3;
  PlacementIssue issue = 4;
  float sharpness_score = 5;
  float lighting_score = 6;
}

enum PlacementIssue {
  PLACEMENT_ISSUE_UNSPECIFIED = 0;
  NONE = 1;
  BOOK_CROPPED = 2;
  TOO_DARK = 3;
  BLURRY = 4;
  CAMERA_BLOCKED = 5;
  PRESENCE_ZONE_NOT_VISIBLE = 6;
  CAMERA_MOVED = 7;
}
